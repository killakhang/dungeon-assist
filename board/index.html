<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dungeon Assist Board</title>
<style>
:root{--bg:#111827;--panel:#1f2937;--line:#4b5563;--text:#f9fafb;--muted:#9ca3af;--gold:#f59e0b;--red:#ef4444;--green:#22c55e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.app{display:grid;grid-template-columns:minmax(0,1fr) 290px;min-height:100vh}.stage{padding:18px;overflow:auto}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.top h1{font-size:18px;margin:0 auto 0 0}.btn{background:#374151;color:white;border:1px solid #6b7280;border-radius:9px;padding:9px 12px;cursor:pointer}.board{position:relative;width:960px;height:640px;border:2px solid #6b7280;border-radius:14px;overflow:hidden;background:
radial-gradient(circle at 30% 30%,rgba(34,197,94,.14),transparent 25%),
linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px),
#273548;background-size:auto,48px 48px,48px 48px;box-shadow:0 15px 50px #0008}
.prop{position:absolute;background:#574331;border:2px solid #80664e}.wall{left:330px;top:0;width:48px;height:240px}.crate{left:620px;top:190px;width:70px;height:70px;border-radius:8px}.fire{left:445px;top:300px;width:70px;height:70px;border-radius:50%;background:#7c2d12;border-color:#f59e0b;display:grid;place-items:center;font-size:30px}
.token{position:absolute;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:3px solid white;font-size:27px;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 10px #0009}.token.selected{outline:4px solid var(--gold);outline-offset:3px}.hero{background:#166534}.enemy{background:#991b1b}.token small{position:absolute;top:62px;white-space:nowrap;font-size:11px;background:#111c;padding:2px 5px;border-radius:5px}.hp{position:absolute;left:3px;right:3px;bottom:-10px;height:6px;background:#3f3f46;border-radius:4px;overflow:hidden}.hp i{display:block;height:100%;background:var(--green)}
.side{background:var(--panel);padding:18px;border-left:1px solid #374151}.side h2{font-size:16px}.card{background:#111827;border:1px solid #374151;border-radius:12px;padding:12px;margin-bottom:10px}.stat{display:flex;justify-content:space-between;margin:7px 0}.muted{color:var(--muted);font-size:12px}.turn{border-color:var(--gold)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger{border-color:#7f1d1d}.log{font-size:12px;max-height:180px;overflow:auto}.log div{padding:5px 0;border-bottom:1px solid #ffffff10}@media(max-width:800px){.app{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid #374151}.board{width:768px;height:528px}}
</style></head><body>
<div class="app"><main class="stage"><div class="top"><h1>⚔️ Dungeon Assist • Abandoned Camp</h1><button class="btn" id="spawn">+ Goblin</button><button class="btn" id="next">Next Turn</button><button class="btn" id="reset">Reset Demo</button></div>
<div class="board" id="board"><div class="prop wall"></div><div class="prop crate"></div><div class="fire">🔥</div></div></main>
<aside class="side"><h2>Initiative</h2><div id="initiative"></div><h2>Selected</h2><div class="card" id="selected">Select a token.</div><h2>Combat log</h2><div class="card log" id="log"></div></aside></div>
<script>
const board=document.querySelector('#board'), init=document.querySelector('#initiative'), selected=document.querySelector('#selected'), log=document.querySelector('#log');
let turn=0, seq=4, creatures=[];
const seed=()=>[{id:'w',name:'Wopples',icon:'👺',kind:'hero',hp:28,max:28,ac:15,x:150,y:390,ini:19},{id:'g1',name:'Goblin 1',icon:'👹',kind:'enemy',hp:7,max:7,ac:15,x:540,y:120,ini:16},{id:'g2',name:'Goblin 2',icon:'👹',kind:'enemy',hp:7,max:7,ac:15,x:700,y:350,ini:12}];
function note(s){let d=document.createElement('div');d.textContent=s;log.prepend(d)}
function render(){board.querySelectorAll('.token').forEach(x=>x.remove());creatures.forEach(c=>{let e=document.createElement('div');e.className='token '+c.kind+(c.sel?' selected':'');e.style.left=c.x+'px';e.style.top=c.y+'px';e.dataset.id=c.id;e.innerHTML=c.icon+'<small>'+c.name+'</small><span class="hp"><i style="width:'+Math.max(0,c.hp/c.max*100)+'%"></i></span>';e.addEventListener('pointerdown',drag);e.addEventListener('click',()=>choose(c.id));board.appendChild(e)});renderInit();renderSelected()}
function renderInit(){init.innerHTML='';[...creatures].sort((a,b)=>b.ini-a.ini).forEach((c,i)=>{let d=document.createElement('div');d.className='card '+(i===turn?'turn':'');d.innerHTML='<b>'+c.icon+' '+c.name+'</b><div class="muted">Initiative '+c.ini+' • HP '+c.hp+'/'+c.max+'</div>';init.appendChild(d)})}
function choose(id){creatures.forEach(c=>c.sel=c.id===id);render()}
function renderSelected(){let c=creatures.find(x=>x.sel);if(!c){selected.textContent='Select a token.';return}selected.innerHTML='<b>'+c.icon+' '+c.name+'</b><div class="stat"><span>HP</span><span>'+c.hp+' / '+c.max+'</span></div><div class="stat"><span>AC</span><span>'+c.ac+'</span></div><div class="actions"><button class="btn danger" id="hurt">− Damage</button><button class="btn" id="heal">+ Heal</button></div>';document.querySelector('#hurt').onclick=()=>{c.hp=Math.max(0,c.hp-1);note(c.name+' takes 1 damage.');render()};document.querySelector('#heal').onclick=()=>{c.hp=Math.min(c.max,c.hp+1);note(c.name+' heals 1 HP.');render()}}
function drag(ev){let el=ev.currentTarget,c=creatures.find(x=>x.id===el.dataset.id);choose(c.id);let sx=ev.clientX,sy=ev.clientY,ox=c.x,oy=c.y;el.setPointerCapture(ev.pointerId);el.onpointermove=e=>{c.x=Math.max(0,Math.min(board.clientWidth-58,ox+e.clientX-sx));c.y=Math.max(0,Math.min(board.clientHeight-58,oy+e.clientY-sy));el.style.left=c.x+'px';el.style.top=c.y+'px'};el.onpointerup=()=>{c.x=Math.round(c.x/48)*48;c.y=Math.round(c.y/48)*48;note(c.name+' moves to '+(c.x/48+1)+','+(c.y/48+1)+'.');render()}}
document.querySelector('#spawn').onclick=()=>{seq++;creatures.push({id:'g'+seq,name:'Goblin '+seq,icon:'👹',kind:'enemy',hp:7,max:7,ac:15,x:48*(10+seq%5),y:48*(2+seq%6),ini:10});note('Goblin '+seq+' enters combat.');render()};
document.querySelector('#next').onclick=()=>{turn=(turn+1)%Math.max(1,creatures.length);render();note('Turn advanced.')};
document.querySelector('#reset').onclick=()=>{creatures=seed();turn=0;log.innerHTML='';note('Demo reset.');render()};
creatures=seed();note('Combat begins. Wopples acts first.');render();
</script></body></html>
