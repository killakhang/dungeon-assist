<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wopples' Dungeon Buddy VTT</title>
<style>
:root{--bg:#111827;--panel:#1f2937;--line:#4b5563;--text:#f9fafb;--muted:#9ca3af;--gold:#f59e0b;--red:#ef4444;--green:#22c55e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.app{display:grid;grid-template-columns:minmax(0,1fr) 290px;min-height:100vh}.stage{padding:18px;overflow:auto}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.top h1{font-size:18px;margin:0 auto 0 0}.btn{background:#374151;color:white;border:1px solid #6b7280;border-radius:9px;padding:9px 12px;cursor:pointer}.board{position:relative;width:960px;height:640px;border:2px solid #6b7280;border-radius:14px;overflow:hidden;background:
radial-gradient(circle at 30% 30%,rgba(34,197,94,.14),transparent 25%),
linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px),
#273548;background-size:auto,48px 48px,48px 48px;box-shadow:0 15px 50px #0008}
.prop{position:absolute;background:#574331;border:2px solid #80664e}.wall{left:330px;top:0;width:48px;height:240px}.crate{left:620px;top:190px;width:70px;height:70px;border-radius:8px}.fire{left:445px;top:300px;width:70px;height:70px;border-radius:50%;background:#7c2d12;border-color:#f59e0b;display:grid;place-items:center;font-size:30px}
.token{position:absolute;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:3px solid white;font-size:27px;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 10px #0009}.token.selected{outline:4px solid var(--gold);outline-offset:3px}.hero{background:#166534}.enemy{background:#991b1b}.token small{position:absolute;top:62px;white-space:nowrap;font-size:11px;background:#111c;padding:2px 5px;border-radius:5px}.hp{position:absolute;left:3px;right:3px;bottom:-10px;height:6px;background:#3f3f46;border-radius:4px;overflow:hidden}.hp i{display:block;height:100%;background:var(--green)}
.side{background:var(--panel);padding:18px;border-left:1px solid #374151}.side h2{font-size:16px}.card{background:#111827;border:1px solid #374151;border-radius:12px;padding:12px;margin-bottom:10px}.stat{display:flex;justify-content:space-between;margin:7px 0}.muted{color:var(--muted);font-size:12px}.turn{border-color:var(--gold)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger{border-color:#7f1d1d}.log{font-size:12px;max-height:180px;overflow:auto}.log div{padding:5px 0;border-bottom:1px solid #ffffff10}@media(max-width:800px){.app{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid #374151}.board{width:768px;height:528px}}
</style></head><body>
<div class="app"><main class="stage"><div class="top"><h1>⚔️ Wopples' Dungeon Buddy • Live VTT</h1><button class="btn" id="spawn">+ Goblin</button><button class="btn" id="next">Next Turn</button><button class="btn" id="reset">Reset Demo</button></div>
<div class="board" id="board"><div class="prop wall"></div><div class="prop crate"></div><div class="fire">🔥</div></div></main>
<aside class="side"><h2>Initiative</h2><div id="initiative"></div><h2>Selected</h2><div class="card" id="selected">Select a token.</div><h2>Combat log</h2><div class="card log" id="log"></div></aside></div>
<script>
const board=document.querySelector('#board'), init=document.querySelector('#initiative'), selected=document.querySelector('#selected'), log=document.querySelector('#log');
const params=new URLSearchParams(location.search); const guild=params.get('guild'), token=params.get('token');
let turn=0, creatures=[], socket=null;
function note(s){let d=document.createElement('div');d.textContent=s;log.prepend(d)}
function send(action,c,extra={}){if(!socket||socket.readyState!==1){note('Not connected to Dungeon Buddy.');return}socket.send(JSON.stringify({action,name:c.name,...extra}))}
function render(){board.querySelectorAll('.token').forEach(x=>x.remove());creatures.forEach(c=>{let e=document.createElement('div');e.className='token '+(c.kind==='monster'?'enemy':'hero')+(c.sel?' selected':'');e.style.left=(c.x*48)+'px';e.style.top=(c.y*48)+'px';e.dataset.name=c.name;e.innerHTML=(c.icon||'⚔️')+'<small>'+c.name+'</small><span class="hp"><i style="width:'+Math.max(0,c.hp/c.max_hp*100)+'%"></i></span>';e.addEventListener('pointerdown',drag);e.addEventListener('click',()=>choose(c.name));board.appendChild(e)});renderInit();renderSelected()}
function renderInit(){init.innerHTML='';creatures.forEach((c,i)=>{let d=document.createElement('div');d.className='card '+(i===turn?'turn':'');d.innerHTML='<b>'+(c.icon||'⚔️')+' '+c.name+'</b><div class="muted">HP '+c.hp+'/'+c.max_hp+' • AC '+c.ac+'</div>';init.appendChild(d)})}
function choose(name){creatures.forEach(c=>c.sel=c.name===name);render()}
function renderSelected(){let c=creatures.find(x=>x.sel);if(!c){selected.textContent='Select a token.';return}selected.innerHTML='<b>'+(c.icon||'⚔️')+' '+c.name+'</b><div class="stat"><span>HP</span><span>'+c.hp+' / '+c.max_hp+'</span></div><div class="stat"><span>AC</span><span>'+c.ac+'</span></div><div class="actions"><button class="btn danger" id="hurt">− Damage</button><button class="btn" id="heal">+ Heal</button></div>';document.querySelector('#hurt').onclick=()=>send('damage',c,{amount:1});document.querySelector('#heal').onclick=()=>send('heal',c,{amount:1})}
function drag(ev){let el=ev.currentTarget,c=creatures.find(x=>x.name===el.dataset.name);choose(c.name);let sx=ev.clientX,sy=ev.clientY,ox=c.x*48,oy=c.y*48;el.setPointerCapture(ev.pointerId);el.onpointermove=e=>{el.style.left=Math.max(0,Math.min(board.clientWidth-58,ox+e.clientX-sx))+'px';el.style.top=Math.max(0,Math.min(board.clientHeight-58,oy+e.clientY-sy))+'px'};el.onpointerup=e=>{let x=Math.round(Math.max(0,ox+e.clientX-sx)/48),y=Math.round(Math.max(0,oy+e.clientY-sy)/48);send('move',c,{x,y});note(c.name+' moved to '+x+','+y+'.')}}
function connect(){if(!guild||!token){note('Open this tabletop from the private /tabletop link in Discord.');return}let proto=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(proto+'://'+location.host+'/ws/'+guild+'?token='+encodeURIComponent(token));socket.onopen=()=>note('Connected to Dungeon Buddy.');socket.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='state'){let old=creatures.find(x=>x.sel)?.name;creatures=m.creatures||[];if(old)creatures.forEach(c=>c.sel=c.name===old);turn=(m.combat&&m.combat.turn)||0;render()}else if(m.type==='error')note(m.message)};socket.onclose=()=>{note('Connection lost. Retrying…');setTimeout(connect,2000)}}
document.querySelector('#spawn').style.display='none';
document.querySelector('#reset').style.display='none';
document.querySelector('#next').onclick=()=>note('Advance turns from Discord with /combat_next for now.');
connect();render();
</script></body></html>
