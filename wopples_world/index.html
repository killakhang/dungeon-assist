<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wopples World Combat</title>
<style>
html,body{margin:0;background:#171722;color:#fff;font-family:monospace;height:100%;overflow:hidden}#game{display:block;margin:auto;max-width:100vw;max-height:100vh;image-rendering:pixelated;background:#273a2c;box-shadow:0 0 70px #000}#hud{position:fixed;left:12px;top:12px;background:#15131bdd;padding:10px;border:2px solid #f0c66d;border-radius:9px;min-width:270px}.bar{height:10px;background:#382b35;margin:4px 0;border:1px solid #eee}.fill{height:100%;background:#d45b62}.stam{background:#e8ca62}.small{opacity:.82}#msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#15131be8;border:2px solid #f0c66d;padding:10px 16px;border-radius:9px;text-align:center}button{font:inherit;margin:4px;padding:5px 8px}
</style></head><body><canvas id="game" width="960" height="640"></canvas>
<div id="hud"><b>WOPPLES WORLD — THE MOSSWOOD</b><br><span id="status">Connecting...</span><div>HP <span id="hp">100</span><div class="bar"><div id="hpbar" class="fill"></div></div></div><div>STAMINA<div class="bar"><div id="stbar" class="fill stam"></div></div></div><span class="small">WASD move • J attack • SPACE dodge • H heal<br>Controller: left stick/D-pad • A attack • B dodge • Y heal</span><br><button id="blob">Spawn Blob Squad</button><button id="boss">Mushroom King</button></div><div id="msg">The Mosswood is watching.</div>
<script>
const C=document.querySelector("#game"),g=C.getContext("2d"),statusEl=document.querySelector("#status"),msg=document.querySelector("#msg"),hp=document.querySelector("#hp"),hpbar=document.querySelector("#hpbar"),stbar=document.querySelector("#stbar");
const TILE=40,W=24,H=16,name=new URLSearchParams(location.search).get("name")||("Wopples"+Math.floor(Math.random()*99));
let me={id:null,name,x:8,y:8,hp:100,stamina:100},players=[],monsters=[],events=[],keys={},ws,last=performance.now(),lastSend=0,lastEvent=0,face={x:1,y:0},slash=0,dodgeFlash=0;
let padPrev={},activePad="";
function pressed(p,i){return !!p?.buttons?.[i]?.pressed}
function edge(p,i){let v=pressed(p,i),old=!!padPrev[i];padPrev[i]=v;return v&&!old}
function gamepad(){
  let pads=navigator.getGamepads?navigator.getGamepads():[],p=[...pads].find(Boolean);if(!p)return {dx:0,dy:0};
  if(activePad!==p.id){activePad=p.id;statusEl.textContent="Controller ready • "+name}
  let ax=Math.abs(p.axes[0]||0)>.18?p.axes[0]:0, ay=Math.abs(p.axes[1]||0)>.18?p.axes[1]:0;
  let dx=ax+(pressed(p,15)?1:0)-(pressed(p,14)?1:0),dy=ay+(pressed(p,13)?1:0)-(pressed(p,12)?1:0);
  if(edge(p,0)){send({action:"attack",x:me.x,y:me.y});slash=.14}
  if(edge(p,1)){send({action:"dodge",dx:face.x,dy:face.y,x:me.x,y:me.y});dodgeFlash=.32}
  if(edge(p,3))send({action:"heal",x:me.x,y:me.y});
  return {dx:Math.max(-1,Math.min(1,dx)),dy:Math.max(-1,Math.min(1,dy))}
}
function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}
function connect(){let p=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(p+"://"+location.host+"/world/ws?name="+encodeURIComponent(name));ws.onopen=()=>statusEl.textContent="Shared combat • "+name;ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type!=="state")return;players=Object.values(m.combat?.players||[]);monsters=m.combat?.monsters||[];events=m.combat?.events||[];let mine=players.find(q=>q.name===name);if(mine){me={...me,...mine};}let ev=events.at(-1);if(ev&&ev.at!==lastEvent){lastEvent=ev.at;msg.textContent=ev.text}if(m.combat?.won)msg.textContent="Wopples win. Obviously."};ws.onclose=()=>{statusEl.textContent="Server offline";setTimeout(connect,2500)}}
function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x*TILE,y*TILE,r,0,Math.PI*2);g.fill()}
function goblin(p,self=false){let X=p.x*TILE,Y=p.y*TILE,bob=Math.sin(performance.now()/180+(p.x||0))*.8;Y+=bob;g.save();if(p.down)g.globalAlpha=.45;if(self&&dodgeFlash>0)g.globalAlpha=.55;
g.fillStyle="#0005";g.beginPath();g.ellipse(X,Y+16,17,7,0,0,Math.PI*2);g.fill();
g.fillStyle=self?"#547f38":"#5876a6";g.fillRect(X-10,Y-9,20,24);g.fillStyle=self?"#78a84d":"#7894c2";g.fillRect(X-13,Y-15,26,18);
g.fillStyle=self?"#78a84d":"#7894c2";g.beginPath();g.moveTo(X-12,Y-11);g.lineTo(X-25,Y-17);g.lineTo(X-14,Y-3);g.fill();g.beginPath();g.moveTo(X+12,Y-11);g.lineTo(X+25,Y-17);g.lineTo(X+14,Y-3);g.fill();
g.fillStyle="#503522";g.beginPath();g.moveTo(X-15,Y-16);g.lineTo(X+3,Y-36);g.lineTo(X+16,Y-15);g.fill();g.fillStyle="#735034";g.fillRect(X-14,Y-17,29,4);
g.fillStyle="#171722";g.fillRect(X-7,Y-10,4,4);g.fillRect(X+4,Y-10,4,4);g.fillStyle="#d9d08c";g.fillRect(X-6,Y-9,2,2);g.fillRect(X+5,Y-9,2,2);
g.fillStyle="#3b2a25";g.fillRect(X-7,Y+15,5,7);g.fillRect(X+3,Y+15,5,7);g.fillStyle="#fff";g.font="bold 11px monospace";g.textAlign="center";g.fillText(p.name,X,Y-42);
if(self&&slash>0){g.strokeStyle="#fff4bd";g.lineWidth=5;g.beginPath();g.arc(X+face.x*16,Y+face.y*16,25,-1,1.2);g.stroke()}g.restore()}
function monster(m){let X=m.x*TILE,Y=m.y*TILE;if(m.boss){circle(m.x,m.y,32,"#9b4f9f");g.fillStyle="#ead47d";g.beginPath();g.moveTo(X-25,Y-22);g.lineTo(X,Y-50);g.lineTo(X+25,Y-22);g.fill()}else{circle(m.x,m.y,18,"#e98c75");circle(m.x-.25,m.y-.2,3,"#1c1720");circle(m.x+.25,m.y-.2,3,"#1c1720")}let r=m.hp/m.max_hp;g.fillStyle="#271b25";g.fillRect(X-28,Y-38,56,5);g.fillStyle="#df6268";g.fillRect(X-28,Y-38,56*r,5);if(m.windup_until>performance.timeOrigin/1000+performance.now()/1000){g.strokeStyle="#fff0a0";g.lineWidth=3;g.beginPath();g.arc(X,Y,m.boss?43:28,0,Math.PI*2);g.stroke()}}
function draw(){let sky=g.createLinearGradient(0,0,0,C.height);sky.addColorStop(0,"#314a37");sky.addColorStop(1,"#58764a");g.fillStyle=sky;g.fillRect(0,0,C.width,C.height);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){let n=(x*17+y*29)%7;g.fillStyle=n<2?"#527247":n<5?"#587b4b":"#4b6941";g.fillRect(x*TILE,y*TILE,TILE,TILE)}
g.fillStyle="#786348";g.beginPath();g.moveTo(0,330);g.bezierCurveTo(240,285,380,390,610,335);g.bezierCurveTo(770,300,850,365,960,330);g.lineTo(960,430);g.bezierCurveTo(730,390,550,450,350,395);g.bezierCurveTo(180,350,80,420,0,400);g.fill();
for(let i=0;i<28;i++){let X=(i*173)%940,Y=(i*97)%610;g.fillStyle=i%3?"#d9d486":"#d49aaf";g.fillRect(X,Y,4,4);g.fillStyle="#335334";g.fillRect(X+1,Y+4,2,5)}
for(let i=0;i<13;i++){let X=(i*211+40)%930,Y=(i*137+30)%590;g.fillStyle="#263e2d";g.beginPath();g.arc(X,Y,20+(i%3)*5,0,Math.PI*2);g.fill();g.fillStyle="#392c25";g.fillRect(X-4,Y+12,8,18)}
g.strokeStyle="#27352c";g.lineWidth=14;g.strokeRect(7,7,C.width-14,C.height-14);monsters.filter(m=>m.hp>0).forEach(monster);players.filter(p=>p.id!==me.id).forEach(p=>goblin(p));goblin(me,true);requestAnimationFrame(draw)}
addEventListener("keydown",e=>{let k=e.key.toLowerCase();keys[k]=1;if(k==="j"){send({action:"attack",x:me.x,y:me.y});slash=.14}if(k===" "){e.preventDefault();send({action:"dodge",dx:face.x,dy:face.y,x:me.x,y:me.y});dodgeFlash=.32}if(k==="h")send({action:"heal",x:me.x,y:me.y})});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
document.querySelector("#blob").onclick=()=>send({action:"spawn_squad",count:5});document.querySelector("#boss").onclick=()=>send({action:"spawn_boss"});
function tick(t){let dt=Math.min(.05,(t-last)/1000);last=t;let pad=gamepad(),kdx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),kdy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),dx=kdx||pad.dx,dy=kdy||pad.dy,l=Math.hypot(dx,dy)||1;if(dx||dy){face={x:dx/l,y:dy/l};me.x=Math.max(.5,Math.min(23.5,me.x+face.x*4.2*dt));me.y=Math.max(.5,Math.min(15.5,me.y+face.y*4.2*dt))}slash=Math.max(0,slash-dt);dodgeFlash=Math.max(0,dodgeFlash-dt);hp.textContent=Math.ceil(me.hp??100);hpbar.style.width=(me.hp??100)+"%";stbar.style.width=(me.stamina??100)+"%";if(ws?.readyState===1&&t-lastSend>60){send({action:"move",x:me.x,y:me.y,dx,dy});lastSend=t}requestAnimationFrame(tick)}
connect();draw();requestAnimationFrame(tick);
</script></body></html>
