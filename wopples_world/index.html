<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wopples World</title>
<style>html,body{margin:0;background:#171b22;color:#fff;font-family:monospace;height:100%;overflow:hidden}#game{display:block;margin:auto;image-rendering:pixelated;background:#75b85a}#hud{position:fixed;left:12px;top:12px;background:#151515cc;padding:10px;border:2px solid #e6bd63;border-radius:8px}#say{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#151515e8;border:2px solid #e6bd63;padding:10px 16px;border-radius:8px;display:none}.small{opacity:.8}</style></head>
<body><canvas id="game" width="960" height="640"></canvas><div id="hud"><b>WOPPLES WORLD v0.1</b><br><span id="status">Connecting...</span><br><span class="small">WASD / arrows • E interact</span></div><div id="say"></div>
<script>
const c=document.querySelector("#game"),x=c.getContext("2d"),say=document.querySelector("#say"),statusEl=document.querySelector("#status");
const params=new URLSearchParams(location.search),name=params.get("name")||("Goblin"+Math.floor(Math.random()*99));
let me={id:name,name,x:8,y:7},players={},keys={},ws=null,lastSend=0;
const TILE=40, W=24,H=16;
const trees=[[2,2],[3,2],[20,3],[21,3],[4,12],[19,12],[20,12]], water={x:15,y:9,w:6,h:4}, farm={x:4,y:8,w:7,h:5}, npc={x:13,y:5,name:"Moss"};
function blocked(px,py){if(px<.5||py<.5||px>W-.5||py>H-.5)return true;if(px>water.x-.4&&px<water.x+water.w+.4&&py>water.y-.4&&py<water.y+water.h+.4)return true;return trees.some(t=>Math.hypot(px-t[0],py-t[1])<.7)}
function goblin(p,other=false){let px=p.x*TILE,py=p.y*TILE;x.fillStyle=other?"#78a9ff":"#93b83f";x.fillRect(px-12,py-12,24,25);x.fillRect(px-20,py-7,8,8);x.fillRect(px+12,py-7,8,8);x.fillStyle="#5a3329";x.fillRect(px-13,py-17,26,7);x.fillRect(px-8,py-24,18,8);x.fillStyle="#171b22";x.fillRect(px-6,py-5,3,3);x.fillRect(px+4,py-5,3,3);x.fillStyle="#fff";x.font="12px monospace";x.textAlign="center";x.fillText(p.name,px,py-29)}
function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle="#75b85a";x.fillRect(0,0,c.width,c.height);x.strokeStyle="#6ca84f";for(let i=0;i<W;i++)for(let j=0;j<H;j++)x.strokeRect(i*TILE,j*TILE,TILE,TILE);
x.fillStyle="#b88652";x.fillRect(farm.x*TILE,farm.y*TILE,farm.w*TILE,farm.h*TILE);x.strokeStyle="#8b623d";for(let i=0;i<farm.w;i++)for(let j=0;j<farm.h;j++)x.strokeRect((farm.x+i)*TILE,(farm.y+j)*TILE,TILE,TILE);
x.fillStyle="#55aee8";x.fillRect(water.x*TILE,water.y*TILE,water.w*TILE,water.h*TILE);
trees.forEach(t=>{x.fillStyle="#68462c";x.fillRect(t[0]*TILE-5,t[1]*TILE,10,20);x.fillStyle="#286b39";x.beginPath();x.arc(t[0]*TILE,t[1]*TILE-8,20,0,7);x.fill()});
x.fillStyle="#d4c08d";x.fillRect(11*TILE,2*TILE,5*TILE,3*TILE);x.fillStyle="#7e3f31";x.beginPath();x.moveTo(10.5*TILE,2*TILE);x.lineTo(13.5*TILE,.5*TILE);x.lineTo(16.5*TILE,2*TILE);x.fill();
goblin(npc,true);Object.values(players).forEach(p=>{if(p.id!==me.id)goblin(p,true)});goblin(me);requestAnimationFrame(draw)}
function connect(){let proto=location.protocol==="https:"?"wss":"ws";try{ws=new WebSocket(proto+"://"+location.host+"/world/ws?name="+encodeURIComponent(name));ws.onopen=()=>{statusEl.textContent="Shared world • "+name};ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==="state")players=m.players||{}};ws.onclose=()=>{statusEl.textContent="Solo mode • server offline";setTimeout(connect,3000)}}catch(e){statusEl.textContent="Solo mode"}}
function interact(){if(Math.hypot(me.x-npc.x,me.y-npc.y)<1.8){say.textContent='Moss: "Wopples look lost."  Wopples: "Wopples live here."';say.style.display="block";setTimeout(()=>say.style.display="none",3000)}else if(me.x>farm.x-1&&me.x<farm.x+farm.w+1&&me.y>farm.y-1&&me.y<farm.y+farm.h+1){say.textContent='"Wopples farm. Probably."';say.style.display="block";setTimeout(()=>say.style.display="none",1800)}}
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==="e")interact()});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
let prev=performance.now();function tick(now){let dt=Math.min(.05,(now-prev)/1000);prev=now,dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(dx,dy)||1,nx=me.x+dx/l*3*dt,ny=me.y+dy/l*3*dt;if(!blocked(nx,me.y))me.x=nx;if(!blocked(me.x,ny))me.y=ny;if(ws?.readyState===1&&now-lastSend>80){ws.send(JSON.stringify({x:me.x,y:me.y}));lastSend=now}requestAnimationFrame(tick)}connect();draw();requestAnimationFrame(tick);
</script></body></html>
