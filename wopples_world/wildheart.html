<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wildheart</title><style>
*{box-sizing:border-box}body{margin:0;background:#09110d;color:#f5eedb;font-family:ui-rounded,system-ui,sans-serif;overflow:hidden}#game{display:block;width:100vw;height:100vh;image-rendering:pixelated;background:#15271b}.hud{position:fixed;inset:16px 16px auto 16px;display:flex;justify-content:space-between;pointer-events:none}.panel{background:linear-gradient(#17231ce8,#0e1712ed);border:1px solid #a98d55;border-radius:14px;padding:10px 14px;box-shadow:0 6px 20px #0008,inset 0 1px #fff1}.bar{width:150px;height:8px;background:#342d27;border-radius:8px;overflow:hidden;margin-top:5px}.fill{height:100%;background:#8ec66b}.petfill{background:#e0a65c}.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#10150fe8;border:1px solid #756b45;padding:8px 13px;border-radius:10px;color:#d9cfaa}.dialog{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);width:min(680px,92vw);background:#171b14f2;border:2px solid #b99b55;border-radius:14px;padding:16px;display:none}.dialog b{color:#e8c86e}.choices{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.choices button{background:#2c3825;color:#f5efd9;border:1px solid #75895c;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.title{position:fixed;top:18px;left:50%;transform:translateX(-50%);font:900 20px Georgia;color:#ffe09a;letter-spacing:3px;text-shadow:0 3px 0 #3c291d,0 5px 10px #000}.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#1b2318e8;padding:8px 14px;border-radius:20px;opacity:0;transition:.25s}.toast.show{opacity:1}@media(max-width:600px){.hud{font-size:12px}.bar{width:105px}.title{top:70px}}
</style></head><body><canvas id="game"></canvas><div class="title">WILDHEART • MOSSWOOD</div><div class="hud"><div class="panel"><b>Wopples</b><div>♥ <span id="hp">10</span>/10</div><div class="bar"><div id="hpbar" class="fill"></div></div></div><div class="panel"><b>Sprig</b> 🍃<div>Bond <span id="bond">18</span></div><div class="bar"><div id="bondbar" class="fill petfill" style="width:18%"></div></div></div></div><div id="toast" class="toast"></div><div id="dialog" class="dialog"><div id="text"></div><div id="choices" class="choices"></div></div><div class="hint">WASD / arrows move • E interact • Space pet command</div><script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);x.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const world={w:1800,h:1200};const p={x:840,y:650,r:13,s:3,hp:10};const pet={x:810,y:675,bond:18};const keys={};let lock=false,quest=0;const npcs=[{x:710,y:560,name:'Mira',text:'The little Mosslings have been restless. Something huge is moving beneath the old grove.'},{x:1010,y:500,name:'Old Fen',text:'Pets remember kindness. They remember cruelty too. Sprig is watching what kind of goblin you become.'}];const wild=[{x:1150,y:700,type:'Mossling',mood:'curious',t:0},{x:1240,y:390,type:'Glowbug',mood:'shy',t:2},{x:470,y:760,type:'Pebblepup',mood:'sleepy',t:4}];
onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact();if(e.code==='Space'){e.preventDefault();petCommand()}};onkeyup=e=>keys[e.key.toLowerCase()]=false;
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1700)}
function say(html,buttons=[['Continue',closeDialog]]){lock=true;let d=document.getElementById('dialog');document.getElementById('text').innerHTML=html;let q=document.getElementById('choices');q.innerHTML='';buttons.forEach(([n,f])=>{let b=document.createElement('button');b.textContent=n;b.onclick=f;q.appendChild(b)});d.style.display='block'}function closeDialog(){document.getElementById('dialog').style.display='none';lock=false}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function interact(){if(lock)return;let n=npcs.find(n=>dist(p,n)<70);if(n)return say('<b>'+n.name+'</b><br>'+n.text);let w=wild.find(w=>dist(p,w)<65);if(w)return creature(w);if(p.x>1380&&p.y<360)return bossIntro();toast('Nothing nearby answers.')}
function creature(w){say('<b>'+w.type+'</b> watches you. It seems '+w.mood+'.',[['Offer berry',()=>{pet.bond=Math.min(100,pet.bond+4);document.getElementById('bond').textContent=pet.bond;document.getElementById('bondbar').style.width=pet.bond+'%';w.mood='friendly';closeDialog();toast(w.type+' trusts you a little more ♥')}],['Approach',()=>{closeDialog();toast(w.type+' sniffs your hand.')}],['Leave it',closeDialog]])}
function petCommand(){if(lock)return;pet.bond=Math.min(100,pet.bond+.2);toast('Sprig bounds ahead!');let a=Math.atan2(pet.y-p.y,pet.x-p.x);pet.x+=Math.cos(a)*-35;pet.y+=Math.sin(a)*-35}
function bossIntro(){say('<b>THE MUSHROOM KING</b><br>The grove shakes. A crown of fungus rises from the earth. Sprig crouches beside you.',[['Fight together',()=>{closeDialog();quest=2;toast('Boss encounter unlocked! ⚔')}],['Not yet',closeDialog]])}
function pxrect(a,b,w,h,col){x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),w,h)}
function shadow(px,py,w=26){x.fillStyle='#07110a66';x.beginPath();x.ellipse(px,py,w,8,0,0,7);x.fill()}
function tree(px,py,s=1){shadow(px,py+25*s,22*s);pxrect(px-6*s,py-3*s,12*s,30*s,'#493724');let blobs=[[-17,-15,18,'#173d27'],[16,-14,18,'#214b2c'],[0,-30,23,'#285a34'],[-9,-40,15,'#397044'],[13,-35,14,'#31653b']];blobs.forEach(([a,b,r],i)=>{x.fillStyle=i>2?'#3c7544':'#24552f';x.beginPath();x.arc(px+a*s,py+b*s,r*s,0,7);x.fill()});pxrect(px-14*s,py-49*s,10*s,5*s,'#6b9855')}
function house(px,py){shadow(px+55,py+83,64);pxrect(px,py,110,80,'#8a6842');pxrect(px+6,py+7,98,67,'#b58b55');for(let i=0;i<5;i++)pxrect(px+10+i*20,py+12,2,58,'#8f6a42');x.fillStyle='#653f34';x.beginPath();x.moveTo(px-12,py+5);x.lineTo(px+55,py-52);x.lineTo(px+122,py+5);x.fill();x.strokeStyle='#d09a61';x.lineWidth=5;x.stroke();pxrect(px+44,py+38,25,42,'#463124');pxrect(px+15,py+25,22,18,'#f1c76d');pxrect(px+18,py+28,16,12,'#8bc0b2');pxrect(px+77,py+22,20,18,'#f1c76d');pxrect(px+80,py+25,14,12,'#8bc0b2');}
function flower(px,py,col){pxrect(px,py,2,6,'#3c6a37');x.fillStyle=col;x.fillRect(px-2,py-2,3,3);x.fillRect(px+2,py-2,3,3);x.fillRect(px,py-4,3,3)}
function drawGoblin(px,py){shadow(px,py+15,13);pxrect(px-8,py+5,16,12,'#6c4730');pxrect(px-9,py-10,18,17,'#75a64e');pxrect(px-15,py-7,7,5,'#75a64e');pxrect(px+8,py-7,7,5,'#75a64e');pxrect(px-5,py-5,3,4,'#f0e1a6');pxrect(px+3,py-5,3,4,'#f0e1a6');pxrect(px-4,py-4,2,2,'#20261b');pxrect(px+4,py-4,2,2,'#20261b');pxrect(px-8,py+8,16,4,'#b18445');pxrect(px-7,py+17,5,5,'#342820');pxrect(px+2,py+17,5,5,'#342820')}
function drawPet(px,py){shadow(px,py+9,10);x.fillStyle='#e6c96e';x.beginPath();x.arc(px,py,9,0,7);x.fill();pxrect(px-7,py-2,14,8,'#d7b85d');x.fillStyle='#69a557';x.beginPath();x.moveTo(px-1,py-7);x.lineTo(px+13,py-18);x.lineTo(px+6,py-2);x.fill();pxrect(px+3,py-3,2,2,'#182218');pxrect(px-5,py+7,4,3,'#79583b');pxrect(px+3,py+7,4,3,'#79583b')}
function creature(w,bob){shadow(w.x,w.y+10,11);if(w.type==='Mossling'){pxrect(w.x-10,w.y-4+bob,20,14,'#6c984e');x.fillStyle='#e3c891';x.beginPath();x.arc(w.x,w.y-6+bob,9,Math.PI,0);x.fill();pxrect(w.x-4,w.y+bob,2,2,'#1d261a');pxrect(w.x+3,w.y+bob,2,2,'#1d261a')}else if(w.type==='Glowbug'){x.fillStyle='#f6dd73';x.beginPath();x.arc(w.x,w.y+bob,7,0,7);x.fill();x.strokeStyle='#fff2a866';x.lineWidth=5;x.stroke()}else{pxrect(w.x-10,w.y-5+bob,20,14,'#9d8f7a');pxrect(w.x-8,w.y-11+bob,7,7,'#b8a88c');pxrect(w.x+2,w.y-11+bob,7,7,'#b8a88c');pxrect(w.x+3,w.y-3+bob,2,2,'#27251f')}}
function draw(){x.clearRect(0,0,W,H);let camX=Math.max(0,Math.min(world.w-W,p.x-W/2)),camY=Math.max(0,Math.min(world.h-H,p.y-H/2));x.save();x.translate(-camX,-camY);
pxrect(0,0,world.w,world.h,'#315b38');for(let gy=0;gy<world.h;gy+=32)for(let gx=0;gx<world.w;gx+=32){let n=((gx*7+gy*13)%5);pxrect(gx,gy,32,32,n<2?'#335f39':'#315b38');if(n===0){pxrect(gx+8,gy+10,2,5,'#4a7445');pxrect(gx+19,gy+20,2,4,'#244e31')}}
x.strokeStyle='#92774d';x.lineWidth=98;x.lineCap='round';x.beginPath();x.moveTo(-30,670);x.bezierCurveTo(420,575,850,735,1160,610);x.bezierCurveTo(1320,545,1390,430,1470,290);x.stroke();x.strokeStyle='#aa8d5b';x.lineWidth=72;x.stroke();
pxrect(0,950,world.w,250,'#214f58');for(let yy=965;yy<1180;yy+=28){x.strokeStyle=yy%56?'#347080':'#5d9aa0';x.lineWidth=2;for(let xx=0;xx<world.w;xx+=90){x.beginPath();x.moveTo(xx,yy);x.quadraticCurveTo(xx+22,yy-5,xx+45,yy);x.stroke()}}
for(let i=0;i<110;i++){let fx=(i*197+43)%1750,fy=(i*113+91)%900;if(Math.abs(fy-650)>80)flower(fx,fy,i%3===0?'#e6a2a8':i%3===1?'#e9d36d':'#b7a7e4')}
for(let i=0;i<38;i++)tree(55+(i*173)%1690,75+(i*211)%850,.85+(i%3)*.12);
house(620,430);house(820,390);house(930,520);
npcs.forEach((n,i)=>{shadow(n.x,n.y+14,11);pxrect(n.x-8,n.y-9,16,15,i?'#856548':'#a36a87');pxrect(n.x-6,n.y-20,12,12,'#d2ae82');pxrect(n.x-7,n.y-23,14,5,i?'#d5d0bd':'#654354')});
wild.forEach(w=>creature(w,Math.round(Math.sin(performance.now()/400+w.t)*2)));
shadow(1450,276,75);pxrect(1424,248,52,42,'#604a39');x.fillStyle='#b35f4c';x.beginPath();x.arc(1450,226,73,Math.PI,0);x.fill();for(let i=-2;i<=2;i++){pxrect(1447+i*22,218-Math.abs(i)*5,7,7,'#e9c997')}pxrect(1438,258,5,5,'#f2db8a');pxrect(1457,258,5,5,'#f2db8a');
drawPet(pet.x,pet.y);drawGoblin(p.x,p.y);
let grad=x.createRadialGradient(p.x,p.y,40,p.x,p.y,400);grad.addColorStop(0,'#ffe6a608');grad.addColorStop(1,'#06100d38');x.fillStyle=grad;x.fillRect(camX,camY,W,H);x.restore();requestAnimationFrame(draw)}
function tick(){if(!lock){let dx=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),dy=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);if(dx||dy){let l=Math.hypot(dx,dy);p.x=Math.max(20,Math.min(world.w-20,p.x+dx/l*p.s));p.y=Math.max(20,Math.min(world.h-20,p.y+dy/l*p.s))}pet.x+=(p.x-28-pet.x)*.035;pet.y+=(p.y+25-pet.y)*.035}setTimeout(tick,16)}tick();draw();setTimeout(()=>say('<b>Sprig</b> 🍃<br>Your strange little companion chirps toward the forest trail. Something is waiting beyond Mosswood.',[['Let’s go',()=>{closeDialog();toast('Explore Mosswood • talk to creatures • find the old grove')}]]),500);
</script></body></html>
