<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wildheart</title><style>
*{box-sizing:border-box}body{margin:0;background:#10150f;color:#f3edd9;font-family:system-ui,sans-serif;overflow:hidden}#game{display:block;width:100vw;height:100vh;image-rendering:pixelated;background:#172416}.hud{position:fixed;inset:16px 16px auto 16px;display:flex;justify-content:space-between;pointer-events:none}.panel{background:#10150fd9;border:2px solid #756b45;border-radius:12px;padding:10px 13px;box-shadow:0 5px 20px #0007}.bar{width:150px;height:8px;background:#342d27;border-radius:8px;overflow:hidden;margin-top:5px}.fill{height:100%;background:#8ec66b}.petfill{background:#e0a65c}.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#10150fe8;border:1px solid #756b45;padding:8px 13px;border-radius:10px;color:#d9cfaa}.dialog{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);width:min(680px,92vw);background:#171b14f2;border:2px solid #b99b55;border-radius:14px;padding:16px;display:none}.dialog b{color:#e8c86e}.choices{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.choices button{background:#2c3825;color:#f5efd9;border:1px solid #75895c;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.title{position:fixed;top:18px;left:50%;transform:translateX(-50%);font:900 22px Georgia;color:#f0d27b;text-shadow:0 2px 5px #000}.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#1b2318e8;padding:8px 14px;border-radius:20px;opacity:0;transition:.25s}.toast.show{opacity:1}@media(max-width:600px){.hud{font-size:12px}.bar{width:105px}.title{top:70px}}
</style></head><body><canvas id="game"></canvas><div class="title">WILDHEART • MOSSWOOD</div><div class="hud"><div class="panel"><b>Wopples</b><div>♥ <span id="hp">10</span>/10</div><div class="bar"><div id="hpbar" class="fill"></div></div></div><div class="panel"><b>Sprig</b> 🍃<div>Bond <span id="bond">18</span></div><div class="bar"><div id="bondbar" class="fill petfill" style="width:18%"></div></div></div></div><div id="toast" class="toast"></div><div id="dialog" class="dialog"><div id="text"></div><div id="choices" class="choices"></div></div><div class="hint">WASD / arrows move • E interact • Space pet command</div><script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);x.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const world={w:1800,h:1200};const p={x:840,y:650,r:13,s:3,hp:10};const pet={x:810,y:675,bond:18};const keys={};let lock=false,quest=0;const npcs=[{x:710,y:560,name:'Mira',text:'The little Mosslings have been restless. Something huge is moving beneath the old grove.'},{x:1010,y:500,name:'Old Fen',text:'Pets remember kindness. They remember cruelty too. Sprig is watching what kind of goblin you become.'}];const wild=[{x:1150,y:700,type:'Mossling',mood:'curious',t:0},{x:1240,y:390,type:'Glowbug',mood:'shy',t:2},{x:470,y:760,type:'Pebblepup',mood:'sleepy',t:4}];
onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact();if(e.code==='Space'){e.preventDefault();petCommand()}};onkeyup=e=>keys[e.key.toLowerCase()]=false;
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1700)}
function say(html,buttons=[['Continue',closeDialog]]){lock=true;let d=document.getElementById('dialog');document.getElementById('text').innerHTML=html;let q=document.getElementById('choices');q.innerHTML='';buttons.forEach(([n,f])=>{let b=document.createElement('button');b.textContent=n;b.onclick=f;q.appendChild(b)});d.style.display='block'}function closeDialog(){document.getElementById('dialog').style.display='none';lock=false}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function interact(){if(lock)return;let n=npcs.find(n=>dist(p,n)<70);if(n)return say('<b>'+n.name+'</b><br>'+n.text);let w=wild.find(w=>dist(p,w)<65);if(w)return creature(w);if(p.x>1380&&p.y<360)return bossIntro();toast('Nothing nearby answers.')}
function creature(w){say('<b>'+w.type+'</b> watches you. It seems '+w.mood+'.',[['Offer berry',()=>{pet.bond=Math.min(100,pet.bond+4);document.getElementById('bond').textContent=pet.bond;document.getElementById('bondbar').style.width=pet.bond+'%';w.mood='friendly';closeDialog();toast(w.type+' trusts you a little more ♥')}],['Approach',()=>{closeDialog();toast(w.type+' sniffs your hand.')}],['Leave it',closeDialog]])}
function petCommand(){if(lock)return;pet.bond=Math.min(100,pet.bond+.2);toast('Sprig bounds ahead!');let a=Math.atan2(pet.y-p.y,pet.x-p.x);pet.x+=Math.cos(a)*-35;pet.y+=Math.sin(a)*-35}
function bossIntro(){say('<b>THE MUSHROOM KING</b><br>The grove shakes. A crown of fungus rises from the earth. Sprig crouches beside you.',[['Fight together',()=>{closeDialog();quest=2;toast('Boss encounter unlocked! ⚔')}],['Not yet',closeDialog]])}
function tree(px,py,s=1){x.fillStyle='#172b1c';x.fillRect(px-5*s,py,10*s,24*s);x.fillStyle='#315b35';x.beginPath();x.arc(px,py-8*s,25*s,0,7);x.fill();x.fillStyle='#4d7941';x.beginPath();x.arc(px-9*s,py-17*s,15*s,0,7);x.fill()}
function house(px,py){x.fillStyle='#59462e';x.fillRect(px,py,110,80);x.fillStyle='#784b36';x.beginPath();x.moveTo(px-10,py);x.lineTo(px+55,py-55);x.lineTo(px+120,py);x.fill();x.fillStyle='#2b2118';x.fillRect(px+45,py+38,25,42);x.fillStyle='#e4bd67';x.fillRect(px+14,py+25,20,18)}
function drawGoblin(px,py){x.fillStyle='#8bb65a';x.fillRect(px-8,py-10,16,18);x.fillRect(px-14,py-7,7,5);x.fillRect(px+7,py-7,7,5);x.fillStyle='#20251b';x.fillRect(px-5,py-5,3,3);x.fillRect(px+3,py-5,3,3);x.fillStyle='#594333';x.fillRect(px-8,py+8,6,8);x.fillRect(px+2,py+8,6,8)}
function drawPet(px,py){x.fillStyle='#d9bd65';x.beginPath();x.arc(px,py,9,0,7);x.fill();x.fillStyle='#73a85c';x.beginPath();x.moveTo(px,py-8);x.lineTo(px+12,py-18);x.lineTo(px+5,py-3);x.fill();x.fillStyle='#1d251b';x.fillRect(px+3,py-2,2,2)}
function draw(){x.clearRect(0,0,W,H);let camX=Math.max(0,Math.min(world.w-W,p.x-W/2)),camY=Math.max(0,Math.min(world.h-H,p.y-H/2));x.save();x.translate(-camX,-camY);x.fillStyle='#29452a';x.fillRect(0,0,world.w,world.h);x.fillStyle='#49623a';for(let i=0;i<180;i++){let gx=(i*137)%world.w,gy=(i*83)%world.h;x.fillRect(gx,gy,2,5)}x.fillStyle='#a18b59';x.beginPath();x.moveTo(0,650);x.bezierCurveTo(450,570,900,720,1450,520);x.lineWidth=90;x.strokeStyle='#8c7a50';x.stroke();x.fillStyle='#294f5a';x.fillRect(0,950,world.w,250);for(let i=0;i<32;i++)tree(60+(i*173)%1700,80+(i*211)%900,.8+(i%3)*.15);house(620,430);house(820,390);house(930,520);
npcs.forEach(n=>{x.fillStyle='#d6c2a0';x.fillRect(n.x-7,n.y-10,14,22);x.fillStyle='#5b385b';x.fillRect(n.x-8,n.y+3,16,12)});
wild.forEach((w,i)=>{let bob=Math.sin(performance.now()/400+w.t)*3;if(w.type==='Mossling'){x.fillStyle='#93a956';x.beginPath();x.arc(w.x,w.y+bob,12,0,7);x.fill();x.fillStyle='#e9d7a0';x.fillRect(w.x-4,w.y-15+bob,8,6)}else if(w.type==='Glowbug'){x.fillStyle='#eadb72';x.beginPath();x.arc(w.x,w.y+bob,7,0,7);x.fill()}else{ x.fillStyle='#9d8f7a';x.beginPath();x.arc(w.x,w.y+bob,11,0,7);x.fill()}});
x.fillStyle='#452f2a';x.beginPath();x.arc(1450,260,65,0,7);x.fill();x.fillStyle='#b15d49';x.beginPath();x.arc(1450,215,85,Math.PI,0);x.fill();drawPet(pet.x,pet.y);drawGoblin(p.x,p.y);x.restore();requestAnimationFrame(draw)}
function tick(){if(!lock){let dx=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),dy=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);if(dx||dy){let l=Math.hypot(dx,dy);p.x=Math.max(20,Math.min(world.w-20,p.x+dx/l*p.s));p.y=Math.max(20,Math.min(world.h-20,p.y+dy/l*p.s))}pet.x+=(p.x-28-pet.x)*.035;pet.y+=(p.y+25-pet.y)*.035}setTimeout(tick,16)}tick();draw();setTimeout(()=>say('<b>Sprig</b> 🍃<br>Your strange little companion chirps toward the forest trail. Something is waiting beyond Mosswood.',[['Let’s go',()=>{closeDialog();toast('Explore Mosswood • talk to creatures • find the old grove')}]]),500);
</script></body></html>
